<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement — Quiz des Mariés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#f6efe1;--cream-2:#efe5d2;--green:#33503b;--green-deep:#26402d;--gold:#b58b4c;--ink:#2c2820;--ink-soft:#5a5345;--danger:#9c5a4a;--shadow:0 18px 40px -22px rgba(38,34,24,.55);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Jost',sans-serif;color:var(--ink);background:var(--cream);
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(181,139,76,.16),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(51,80,59,.18),transparent 55%);
  min-height:100dvh;}
.wrap{max-width:620px;margin:0 auto;padding:28px 20px 60px}
header{text-align:center;margin-bottom:26px}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500}
h1{font-family:'Cormorant Garamond',serif;font-size:46px;color:var(--green-deep);font-weight:600;line-height:1;margin-top:6px}
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:12px auto}
.ornament span{height:1px;width:46px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.gate{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin-top:30px}
.gate p{color:var(--ink-soft);font-size:15px}
.gate input{font-family:'Jost',sans-serif;font-size:18px;letter-spacing:.18em;text-align:center;text-transform:uppercase;background:#fffdf7;border:1.5px solid var(--cream-2);border-radius:14px;padding:15px 18px;width:100%;max-width:280px;outline:none}
.gate input:focus{border-color:var(--gold)}
.btn{font-family:'Jost',sans-serif;font-size:15px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;border:none;cursor:pointer;color:var(--cream);background:var(--green);padding:15px 30px;border-radius:50px;box-shadow:var(--shadow);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--green);box-shadow:none;border:1.5px solid var(--green)}
.btn.danger{background:var(--danger);color:#fff}
.err{color:var(--danger);font-size:14px;min-height:18px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.count{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:#fffdf7;border:1px solid var(--cream-2);border-radius:14px;padding:13px 16px;box-shadow:0 8px 22px -18px rgba(38,34,24,.5)}
.rank{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;background:var(--cream-2);color:var(--green-deep)}
.row.top1 .rank{background:linear-gradient(135deg,#e9c66b,#b58b4c);color:#fff}
.row.top2 .rank{background:linear-gradient(135deg,#d8d8d4,#a9a9a2);color:#fff}
.row.top3 .rank{background:linear-gradient(135deg,#d8a981,#b07a4e);color:#fff}
.who{flex:1;min-width:0}
.who .name{font-size:16.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .time{font-size:12px;color:var(--ink-soft);margin-top:1px}
.sc{flex:0 0 auto;text-align:right}
.sc b{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--green-deep);font-weight:600;line-height:1}
.sc small{display:block;font-size:11px;color:var(--ink-soft)}
.empty{text-align:center;color:var(--ink-soft);padding:40px 0}
.hidden{display:none!important}
.tools{display:flex;gap:10px;justify-content:center;margin-top:24px}
.danger-zone{margin-top:34px;padding-top:24px;border-top:1px dashed var(--cream-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.confirm{background:#f3e6df;border:1px solid #e6cdbf;border-radius:16px;padding:18px;max-width:400px;text-align:center}
.confirm p{font-size:14.5px;color:#7a3f30;line-height:1.45;margin-bottom:14px}
.confirm-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.confirm-btns .btn{padding:13px 22px;font-size:14px}
.reset-msg{font-size:13px;color:var(--ink-soft);min-height:16px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Quiz des mariés</div>
    <h1>Classement</h1>
    <div class="ornament"><span></span><span style="font-size:18px">❦</span><span></span></div>
  </header>

  <section id="gate" class="gate">
    <p>Espace réservé à l'organisateur.<br>Saisis le code pour voir le classement.</p>
    <input id="code" type="text" inputmode="text" placeholder="Code" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="btn" id="btn-load">Afficher le classement</button>
  </section>

  <section id="board" class="hidden">
    <div class="bar">
      <span class="count" id="count">0 participant</span>
      <button class="btn ghost" id="btn-refresh">Actualiser</button>
    </div>
    <div class="list" id="list"></div>

    <div class="tools"><button class="btn ghost" id="btn-lock">Verrouiller</button></div>

    <div class="danger-zone">
      <button class="btn danger" id="btn-reset">Tout effacer</button>
      <div id="confirm" class="confirm hidden">
        <p>⚠️ Supprimer <b>définitivement tous les scores</b> du classement ?<br>Cette action est irréversible.</p>
        <div class="confirm-btns">
          <button class="btn ghost" id="btn-cancel">Annuler</button>
          <button class="btn danger" id="btn-confirm">Oui, tout effacer</button>
        </div>
      </div>
      <div class="reset-msg" id="reset-msg"></div>
    </div>
  </section>
</div>

<script>
const API = "/.netlify/functions/quiz";
let CODE = "";

const fmtTime = (iso)=>{ try{ return new Date(iso).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }catch(e){ return iso; } };

async function loadBoard(){
  const err=document.getElementById('err'); err.textContent="";
  try{
    const res=await fetch(`${API}?code=${encodeURIComponent(CODE)}`);
    if(res.status===401){ err.textContent="Code invalide."; return false; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    render(data.participants||[], data.count||0);
    return true;
  }catch(e){ err.textContent="Erreur de connexion, réessaie."; return false; }
}

function render(parts,count){
  document.getElementById('count').textContent = count+" participant"+(count>1?"s":"");
  const list=document.getElementById('list'); list.innerHTML="";
  if(!parts.length){ list.innerHTML='<div class="empty">Aucune participation pour le moment.</div>'; return; }
  parts.forEach((p,i)=>{
    const rank=i+1;
    const row=document.createElement('div');
    row.className='row'+(rank<=3?(' top'+rank):'');
    row.innerHTML=`
      <div class="rank">${rank}</div>
      <div class="who">
        <div class="name">${escapeHtml(p.prenom)} ${escapeHtml(p.nom)}</div>
        <div class="time">${fmtTime(p.date)}</div>
      </div>
      <div class="sc"><b>${p.score}</b><small>/ ${p.total}</small></div>`;
    list.appendChild(row);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('btn-load').addEventListener('click', async ()=>{
  CODE=document.getElementById('code').value.trim();
  if(!CODE){ document.getElementById('err').textContent="Saisis le code."; return; }
  if(await loadBoard()){
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('board').classList.remove('hidden');
  }
});
document.getElementById('code').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btn-load').click(); });
document.getElementById('btn-refresh').addEventListener('click', loadBoard);
document.getElementById('btn-lock').addEventListener('click', ()=>{
  CODE=""; document.getElementById('code').value="";
  resetConfirmUI();
  document.getElementById('board').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
});

/* ---- Tout effacer : double validation ---- */
const btnReset=document.getElementById('btn-reset');
const confirmBox=document.getElementById('confirm');
const resetMsg=document.getElementById('reset-msg');

function resetConfirmUI(){ confirmBox.classList.add('hidden'); btnReset.classList.remove('hidden'); resetMsg.textContent=""; }

btnReset.addEventListener('click', ()=>{
  // 1re action : on demande confirmation
  confirmBox.classList.remove('hidden');
  btnReset.classList.add('hidden');
  resetMsg.textContent="";
});
document.getElementById('btn-cancel').addEventListener('click', resetConfirmUI);
document.getElementById('btn-confirm').addEventListener('click', async ()=>{
  // 2e action : confirmation explicite -> suppression
  resetMsg.textContent="Suppression en cours…";
  try{
    const res=await fetch(`${API}?code=${encodeURIComponent(CODE)}`, { method:"DELETE" });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    const n=data.deleted||0;
    confirmBox.classList.add('hidden'); btnReset.classList.remove('hidden');
    resetMsg.textContent=`Classement vidé (${n} participation${n>1?'s':''} supprimée${n>1?'s':''}).`;
    loadBoard();
  }catch(e){ resetMsg.textContent="Erreur lors de la suppression, réessaie."; }
});
</script>
</body>
</html>
